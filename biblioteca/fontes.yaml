# Registro de fontes da biblioteca. Campos obrigatórios: titulo, editor, ano,
# licenca. Valores conhecidos de `licenca`: acesso-aberto-governo,
# creative-commons-<tipo>, licenciado-<contrato>, institucional, sem-licenca.
# A antiga regra R4 (licença válida obrigatória) foi retirada pelo responsável
# técnico em 28/09/2026: o script só avisa. `tenant_id: global` = todas as
# unidades; um uuid de unidade restringe a ela.
#
# Os dois livros-fonte das ferramentas (Manual HCFMUSP 2022 e PS Pediatria ICr
# 2023) já estão em raw/ no VPS; a entrada deles aqui fica a cargo do usuário
# (modelo em README.md, seção "Entrada dos livros").
#
# `publico` (R2-13, decisão do RT em 13/10/2026): pediatrico, adulto ou ambos.
# Pergunta de criança só busca em fonte pediatrico/ambos; pergunta de adulto não
# busca em fonte só pediatrico. Sem o campo, a fonte é adulto. Nas pastas, o
# `publico` do cabeçalho de cada ficha vale sobre o da pasta.

- arquivo: ms_dengue_2024.pdf
  publico: ambos
  titulo: "Dengue: diagnóstico e manejo clínico — adulto e criança, 6ª ed."
  editor: "Ministério da Saúde"
  ano: 2024
  licenca: "acesso-aberto-governo"
  url: "https://www.gov.br/saude/pt-br/centrais-de-conteudo/publicacoes/svsa/dengue/dengue-diagnostico-e-manejo-clinico-adulto-e-crianca"
  tenant_id: global

