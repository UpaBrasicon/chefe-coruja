# Biblioteca da HOMOLOGAÇÃO (decisão do RT em 13/10/2026, R2-13): uma segunda
# API, com o código da branch em teste, sobre o mesmo Qdrant e o mesmo Ollama.
# A produção (serviço `api`) não muda até o "ok produção".
#   docker compose -f docker-compose.yml -f docker-compose.homolog.yml up -d --build api-homolog
# O Caddy publica em https://biblioteca.chefecoruja.com.br/homolog/ (handle_path).
#
# Portão 2, tarefa 1b: a homologação lê uma CÓPIA da coleção de trechos
# (biblioteca_homolog) e o corpus da branch (/srv/biblioteca/corpus-homolog,
# montado por cima de /srv/biblioteca/corpus só dentro deste container). Assim
# o corpus novo é ingerido e testado sem mudar o que a produção lê.
services:
  api-homolog:
    build: ./app-homolog
    container_name: biblioteca-api-homolog
    restart: unless-stopped
    env_file: ./app/.env
    environment:
      BIBLIOTECA_COLECAO: biblioteca_homolog
    ports: ["127.0.0.1:8711:8710"]
    depends_on: [qdrant, ollama]
    volumes:
      - "/srv/biblioteca:/srv/biblioteca:ro"
      - "/srv/biblioteca/corpus-homolog:/srv/biblioteca/corpus:ro"
    networks: [default, hermes]
    deploy: { resources: { limits: { memory: 600m } } }
