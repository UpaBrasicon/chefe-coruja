# ─────────────────────────────────────────────────────────────────────────────
# HERMES — docker-compose.yml (Fase 1: app + redis)
# Uso: docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      # Persistência do AOF (dedup/rate limit sobrevivem a restart).
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: hermes-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do compose, o Redis é alcançável pelo nome do serviço.
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # O app só é considerado saudável quando o /health responde ok.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
