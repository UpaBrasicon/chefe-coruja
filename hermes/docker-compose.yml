# ─────────────────────────────────────────────────────────────────────────────
# HERMES — docker-compose.yml (Fase 0: app + redis)
# Uso: docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: hermes-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do compose, o Redis é alcançável pelo nome do serviço.
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
