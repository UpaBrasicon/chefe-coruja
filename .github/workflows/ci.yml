# CI do Chefe Coruja — roda a cada push e PR em master e porte-frontend.
# Sem segredos: nada aqui fala com o Supabase de produção. O banco é o local
# (Docker) que o `supabase start` sobe no próprio runner, com migrations + seed.
name: CI

on:
  push:
    branches: [master, porte-frontend]
  pull_request:
    branches: [master, porte-frontend]

permissions:
  contents: read

# Um push novo no mesmo ramo cancela a rodada anterior que ainda estiver rodando.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Front (React + Vite) e os testes em Node puro da raiz.
  web:
    name: web (lint, build, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Trilha "Padrão do frontend", parte 3: catraca do guia (docs/frontend/GUIA.md).
      # Falha se algum arquivo piorar, se a base ficar para trás de uma correção ou
      # se a base do PR subir em relação à do ramo de destino.
      - name: Padrão do frontend
        env:
          RAMO_DESTINO: ${{ github.base_ref || 'master' }}
        run: |
          node --test scripts/padrao-frontend.test.mjs
          git fetch --no-tags --depth=1 origin "$RAMO_DESTINO"
          node scripts/padrao-frontend.mjs --ci --comparar FETCH_HEAD
      # Fase 0, item 14: typecheck é passo próprio e bloqueante (o build também roda tsc)
      - name: Typecheck
        run: npm run typecheck
      - name: Build (tsc + vite)
        run: npm run build
      # Fase 3, tarefa 6: contrato da API pública (OpenAPI 3.1)
      - name: Contrato da API (OpenAPI)
        run: npm run api:lint
        env:
          REDOCLY_TELEMETRY: 'off'
      # Fase 3, tarefa 7: rotas, parâmetros e erros da Edge Function `api`
      - name: Edge Function da API (regras)
        run: node --experimental-strip-types --test supabase/functions/api/contrato.test.ts supabase/functions/api/fhir.test.ts supabase/functions/api/financeiro.test.ts supabase/functions/webhooks/assinatura.test.ts
      - name: Testes clínicos
        run: npm run test:clinico
      - name: Gateway (cópia da desidentificação)
        run: npm run test:gateway
      - name: Domínio, terminologia, observação, interop
        run: |
          npm run test:dominio
          npm run test:terminologia
          npm run test:observacao
          npm run test:interop
      - name: src/lib (cópias das Edge Functions)
        run: node --experimental-strip-types --test src/lib/*.test.ts src/lib/offline/*.test.ts
      - name: Cofre da guarda
        run: node --test scripts/arquivo/cofre.test.mjs
      - name: Trava de alvo do Supabase (homologação antes de produção)
        run: node --test scripts/ambiente/supabase-alvo.test.mjs
      # Fase 0, item 14: migration nova não apaga nem renomeia o que a versão anterior usa
      - name: Expand/contract nas migrations
        run: |
          node --test scripts/ambiente/migrations-destrutivas.test.mjs
          node scripts/ambiente/migrations-destrutivas.mjs

  # Testes SQL (supabase/tests/*.sql) num Supabase local recém-criado.
  banco:
    name: banco (supabase/tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          # mesma versão do devDependency `supabase` do package.json
          version: 2.102.0
      # Imagens do Supabase guardadas no cache do Actions. Os registros públicos
      # barraram os runners do GitHub em 26/10/2026 (PRs #239 a #241): ghcr.io e
      # Docker Hub com "toomanyrequests", ECR com "Data limit exceeded"; em
      # 27/10/2026 (PR #270) o ghcr.io barrou realtime e storage-api.
      # A primeira vez que um registro servir, a imagem fica no cache e o CI
      # deixa de depender deles. Tags do CLI 2.102.0 (fixado acima; ficam no
      # pkg/config/templates/Dockerfile do CLI): ao atualizar o CLI, atualizar as
      # tags e as chaves aqui (senão o CLI volta a pedir as imagens ao ghcr.io).
      # Postgres e serviços em chaves separadas: o cache do Postgres já existe.
      - name: Restaurar a imagem do Postgres do cache
        id: cache-postgres
        uses: actions/cache/restore@v4
        with:
          path: /tmp/supabase-postgres.tar
          key: supabase-postgres-17.6.1.131
      - name: Restaurar as imagens do auth e do storage do cache
        id: cache-servicos
        uses: actions/cache/restore@v4
        with:
          path: /tmp/supabase-servicos.tar
          key: supabase-gotrue-v2.189.0-storage-api-v1.60.0
      - name: Obter as imagens do Supabase
        run: |
          # $1 = arquivo do cache; os demais = imagens. Mesma imagem nos três
          # registros (digests conferidos: postgres sha256:42088c86… em
          # 26/10/2026; gotrue sha256:385184459f… e storage-api
          # sha256:8cbdce289b… em 27/10/2026). O nome final é o do ghcr.io,
          # que é o que o CLI procura (o setup-cli fixa esse registro).
          obter() {
            arquivo=$1
            shift
            if [ -f "$arquivo" ]; then
              docker load -i "$arquivo"
              return 0
            fi
            for imagem in "$@"; do
              obtida=
              for origem in docker.io public.ecr.aws ghcr.io; do
                for tentativa in 1 2; do
                  if docker pull "$origem/$imagem"; then
                    [ "$origem" = ghcr.io ] || docker tag "$origem/$imagem" "ghcr.io/$imagem"
                    obtida=1
                    break 2
                  fi
                  echo "::warning::$origem recusou $imagem (tentativa $tentativa)"
                  sleep 20
                done
              done
              [ -n "$obtida" ] || return 1
            done
            docker save $(printf 'ghcr.io/%s ' "$@") -o "$arquivo"
          }
          obter /tmp/supabase-postgres.tar supabase/postgres:17.6.1.131
          obter /tmp/supabase-servicos.tar supabase/gotrue:v2.189.0 supabase/storage-api:v1.60.0
      - name: Guardar a imagem do Postgres no cache
        if: steps.cache-postgres.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/supabase-postgres.tar
          key: supabase-postgres-17.6.1.131
      - name: Guardar as imagens do auth e do storage no cache
        if: steps.cache-servicos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/supabase-servicos.tar
          key: supabase-gotrue-v2.189.0-storage-api-v1.60.0
      - name: Subir Supabase local (migrations + seed)
        # Os testes só usam o contêiner do banco (`docker exec psql`). Antes das
        # migrations, o CLI roda os jobs de migração do gotrue (schema auth:
        # auth.sessions, auth.mfa_factors) e do storage-api (storage.buckets e
        # storage.objects), com as imagens do cache, e só depois sobe os
        # serviços. Por isso os contêineres de auth, storage, kong e postgrest
        # ficam de fora no -x. O -x não pula o job do realtime: só a config
        # desligada pula (SUPABASE_REALTIME_ENABLED). As migrations só usam a
        # publicação supabase_realtime, que já vem na imagem do Postgres.
        # Nomes do CLI 2.102 (mailpit, logflare e postgres-meta no lugar de
        # inbucket, analytics e meta, que o CLI ignorava e baixava assim mesmo).
        # Sem cache, o ghcr.io pode recusar com "toomanyrequests" (limite do
        # próprio registro, PR #239, 26/10/2026); o CLI só espera 4 e 8 s, então
        # tentamos de novo com pausas de 30, 60 e 90 s.
        env:
          SUPABASE_REALTIME_ENABLED: 'false'
        run: |
          for tentativa in 1 2 3 4; do
            supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,postgres-meta,gotrue,storage-api,kong,postgrest && exit 0
            [ "$tentativa" = 4 ] && break
            echo "::warning::supabase start falhou (tentativa $tentativa); nova tentativa em $((tentativa * 30)) s"
            supabase stop --no-backup || true
            sleep $((tentativa * 30))
          done
          exit 1
      - name: Testes de banco
        # o contêiner é supabase_db_<project_id> = supabase_db_chefe-coruja
        run: npm run test:banco
      - name: Parar Supabase
        if: always()
        run: supabase stop --no-backup

  # Hermes / Gavião (subprojeto com package.json próprio).
  hermes:
    name: hermes (typecheck, lint, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hermes
    # Valores fictícios só para o env.ts validar. Sem SVC_KEY e sem
    # LLM_API_KEY, os testes de integração (Supabase/LLM/WhatsApp reais) pulam.
    env:
      NODE_ENV: test
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-chave-ficticia-sem-acesso
      META_VERIFY_TOKEN: ci
      META_APP_SECRET: ci
      META_ACCESS_TOKEN: ci
      META_PHONE_NUMBER_ID: ci
      HERMES_ORG_TESTE_ID: 00000000-0000-0000-0000-000000000001
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hermes/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (inclui a regra do gateway de IA — ADR 0006)
        run: npm run lint
      - name: Guarda — supabaseUser só com .rpc()
        run: node --import tsx --test src/lib/supabase-rpc-only.test.ts
      - name: Testes
        # o script usa --env-file=.env; no CI o .env fica vazio e valem as
        # variáveis acima (o --env-file não sobrescreve o ambiente).
        run: |
          touch .env
          npm test

  nous:
    # Plugin e vigias do Nous (Python, só stdlib nos testes unitários).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Plugin chefe-coruja
        run: python -m unittest discover -s hermes/deploy/nous-plugin/tests -v
      - name: Coruja Lab (organizador de skills)
        run: python -m unittest discover -s hermes/deploy/nous-lab/tests -v
      - name: Vigias
        run: |
          pip install tzdata
          python -m unittest discover -s hermes/deploy/nous-vigias/tests -v
